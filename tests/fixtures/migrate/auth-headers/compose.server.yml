# Only an https router: Caddy redirects http to https itself.
services:
  app:
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # APP_HOSTS may hold several Host(...) rules; the default is the one APP_HOST.
      - "traefik.http.routers.auth-headers.rule=${APP_HOSTS:-Host(`${APP_HOST}`)}"
      - "traefik.http.routers.auth-headers.entrypoints=websecure"
      - "traefik.http.routers.auth-headers.tls=true"
      - "traefik.http.routers.auth-headers.tls.certresolver=letsencrypt"
      - "traefik.http.routers.auth-headers.middlewares=auth-headers-secure,auth-headers-auth"
      - "traefik.http.services.auth-headers.loadbalancer.server.port=3000"
      - "traefik.http.services.auth-headers.loadbalancer.server.scheme=http"
      - "traefik.http.services.auth-headers.loadbalancer.passhostheader=true"
      # Security headers
      - "traefik.http.middlewares.auth-headers-secure.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.auth-headers-secure.headers.frameDeny=true"
      - "traefik.http.middlewares.auth-headers-secure.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.auth-headers-secure.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.auth-headers-secure.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.auth-headers-secure.headers.forceSTSHeader=true"
      # Single sign-on in front of the app
      - "traefik.http.middlewares.auth-headers-auth.forwardauth.address=https://auth.example-f.test/auth/forward"
      - "traefik.http.middlewares.auth-headers-auth.forwardauth.authResponseHeaders=X-Forwarded-User"
      - "traefik.http.middlewares.auth-headers-auth.forwardauth.trustForwardHeader=true"

networks:
  web:
    external: true
    name: web
