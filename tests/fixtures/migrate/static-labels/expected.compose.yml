# Hand-written stack of a static app: no repo, no include.
name: static-labels

services:
  site:
    image: python:3.13-alpine
    restart: unless-stopped
    mem_limit: 128m
    networks:
      web:
        aliases:
          - static-labels-site
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.static-labels.rule=Host(`static.example-j.test`)"
      - "traefik.http.routers.static-labels.entrypoints=websecure"
      - "traefik.http.routers.static-labels.tls.certresolver=letsencrypt"
      - "traefik.http.services.static-labels.loadbalancer.server.port=8000"
    volumes:
      - ./data:/data

networks:
  web:
    name: ${MD_WEB_NETWORK:-web}
    external: true
