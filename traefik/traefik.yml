# Global Traefik configuration for multi-app hosting
api:
  dashboard: true

# Per-request access log → stdout (visible via `docker compose logs traefik`).
# format: common (CLF text) or json. Logs every request by default; to log only
# a subset add a `filters:` block (a request is kept if it matches ANY filter):
#   filters:
#     statusCodes: ["400-599"]   # only errors
#     retryAttempts: true
#     minDuration: "100ms"       # only slow requests
accessLog:
  format: common

providers:
  docker:
    exposedByDefault: false
  # Dynamic config (middlewares, routers referenced as `…@file`) lives here.
  # Static traefik.yml has no top-level `http:` key — dynamic config MUST come
  # from a provider, so `security-headers@file` is defined in dynamic.yml.
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

certificatesResolvers:
  letsencrypt:
    acme:
      # Email is configured via environment variable mapping in docker-compose.yml
      storage: /letsencrypt/acme.json
      # HTTP-01 over the `web` (:80) entrypoint. Single non-proxied server: Traefik
      # owns 80/443 directly and serves /.well-known/acme-challenge/ before any
      # per-app HTTP→HTTPS redirect. (TLS-ALPN-01 failed to negotiate acme-tls/1
      # in this environment; HTTP-01 has fewer moving parts and is reliable here.)
      httpChallenge:
        entryPoint: web

serversTransport:
  forwardingTimeouts:
    dialTimeout: "30s"
    responseHeaderTimeout: "0s"
    idleConnTimeout: "90s"
