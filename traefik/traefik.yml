# Global Traefik configuration for multi-app hosting
api: 
  dashboard: true

providers:
  docker:
    exposedByDefault: false
  # Dynamic config (middlewares, routers referenced as `…@file`) lives here.
  # Static traefik.yml has no top-level `http:` key — dynamic config MUST come
  # from a provider, so `security-headers@file` is defined in dynamic.yml.
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

certificatesResolvers:
  letsencrypt:
    acme:
      # Email is configured via environment variable mapping in docker-compose.yml
      storage: /letsencrypt/acme.json
      tlsChallenge: {}

serversTransport:
  forwardingTimeouts:
    dialTimeout: "30s"
    responseHeaderTimeout: "0s"
    idleConnTimeout: "90s"
